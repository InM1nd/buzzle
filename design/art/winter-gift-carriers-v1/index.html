<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buzzle · Пчёлы с подарками</title><style>*{box-sizing:border-box}body{margin:0;background:#171340;color:#fff6e3;font:18px system-ui;text-align:center}main{max-width:1150px;margin:auto;padding:20px 12px}h1{font-size:26px}p{font-size:16px}button,select{padding:12px 18px;margin:6px;border:0;border-radius:16px;background:#ffc56b;color:#493018;font:inherit}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage{aspect-ratio:1024/1600;position:relative;overflow:hidden}.stage img{position:absolute;width:100%;left:0;top:0}.stage .bee{animation:hover 3s ease-in-out infinite}.stage .gift{animation:release 3s ease-in-out infinite}.stage .sack{width:68%;left:16%;top:61.5%}.stage .front{z-index:3}@keyframes hover{0%,20%,100%{transform:translateY(0)}50%,80%{transform:translateY(-4%)}}@keyframes release{0%,20%{transform:translateY(0)}62%,90%{transform:translateY(39%);opacity:1}91%{transform:translateY(39%);opacity:0}99%{transform:translateY(0);opacity:0}100%{transform:translateY(0);opacity:1}}.paused img{animation-play-state:paused!important}.light{background:#fff6e3;color:#493018}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.stage img{animation:none!important}}</style><main><h1>Пчёлы-носильщики</h1><p>Примерка размера и переноски. Подарок отдельным слоем; пчёлы сохранены целиком.</p><select id="species" aria-label="Пчела"><option value="zhuzha">Жужа</option><option value="snow">Снежная</option><option value="gingerbread">Пряничная</option></select><button id="pause" aria-pressed="false">Пауза</button><button id="bg">Светлый фон</button><div class="grid"><section><h2>Красный</h2><div class="stage"><img class="sack" src="sack_red_back.png" alt=""><img class="gift" data-color="red" src="gift_zhuzha_red.png" alt="Подарок"><img class="bee" src="bee_zhuzha.png" alt="Пчела"><img class="sack front" src="sack_red_front.png" alt="Мешок"></div></section><section><h2>Зелёный</h2><div class="stage"><img class="sack" src="sack_green_back.png" alt=""><img class="gift" data-color="green" src="gift_zhuzha_green.png" alt="Подарок"><img class="bee" src="bee_zhuzha.png" alt="Пчела"><img class="sack front" src="sack_green_front.png" alt="Мешок"></div></section><section><h2>Золотой</h2><div class="stage"><img class="sack" src="sack_gold_back.png" alt=""><img class="gift" data-color="gold" src="gift_zhuzha_gold.png" alt="Подарок"><img class="bee" src="bee_zhuzha.png" alt="Пчела"><img class="sack front" src="sack_gold_front.png" alt="Мешок"></div></section><section><h2>Голубой</h2><div class="stage"><img class="sack" src="sack_blue_back.png" alt=""><img class="gift" data-color="blue" src="gift_zhuzha_blue.png" alt="Подарок"><img class="bee" src="bee_zhuzha.png" alt="Пчела"><img class="sack front" src="sack_blue_front.png" alt="Мешок"></div></section></div><p>В игре жест захвата ещё можно уточнить. Это проверка существующих спрайтов, без изменения механик.</p><a style="color:inherit" href="preview.png">Все 12 примерок</a></main><script>species.onchange=()=>{document.querySelectorAll('.bee').forEach(x=>x.src='bee_'+species.value+'.png');document.querySelectorAll('.gift').forEach(x=>x.src='gift_'+species.value+'_'+x.dataset.color+'.png')};pause.onclick=()=>{const p=document.body.classList.toggle('paused');pause.textContent=p?'Продолжить':'Пауза';pause.setAttribute('aria-pressed',p)};bg.onclick=()=>{const l=document.body.classList.toggle('light');bg.textContent=l?'Тёмный фон':'Светлый фон'}</script></html>
