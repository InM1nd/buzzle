<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buzzle · Подарки в мешках</title><style>*{box-sizing:border-box}body{margin:0;background:#171340;color:#fff6e3;font:18px system-ui;text-align:center}main{max-width:1150px;margin:auto;padding:24px 12px}h1{font-size:26px}p{color:#ccc6df}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sack{position:relative;aspect-ratio:512/650;overflow:hidden}.sack img{position:absolute;left:0;top:21.23%;width:100%}.sack .gift{width:25.78125%;left:37.109375%;animation:fall 2.6s infinite}.sack .front{z-index:2}button{border:0;border-radius:20px;background:#ffc56b;color:#493018;padding:14px 24px;font:inherit;cursor:pointer;margin:8px}@keyframes fall{0%,12%{transform:translateY(-83.333%)}78%,100%{transform:translateY(166.666%)}}.paused .gift{animation-play-state:paused}.light{background:#fff6e3;color:#493018}.light p{color:#725b46}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.sack .gift{animation:none;transform:translateY(89.39%)}}</style><main><h1>Подарок падает внутрь мешка</h1><p>Исходные мешки сохранены. Передний край скрывает падающую коробку.</p><button id="pause" aria-pressed="false">Пауза</button><button id="bg">Светлый фон</button><div class="grid"><section><h2>Красный</h2><div class="sack"><img src="sack_red_back.png" alt=""><img class="gift" src="gift_red.png" alt="Подарок"><img class="front" src="sack_red_front.png" alt="Мешок"></div></section><section><h2>Зелёный</h2><div class="sack"><img src="sack_green_back.png" alt=""><img class="gift" src="gift_green.png" alt="Подарок"><img class="front" src="sack_green_front.png" alt="Мешок"></div></section><section><h2>Золотой</h2><div class="sack"><img src="sack_gold_back.png" alt=""><img class="gift" src="gift_gold.png" alt="Подарок"><img class="front" src="sack_gold_front.png" alt="Мешок"></div></section><section><h2>Голубой</h2><div class="sack"><img src="sack_blue_back.png" alt=""><img class="gift" src="gift_blue.png" alt="Подарок"><img class="front" src="sack_blue_front.png" alt="Мешок"></div></section></div><p>Проба слоёв — без игровой логики.</p></main><script>document.getElementById('pause').onclick=function(){const p=document.body.classList.toggle('paused');this.textContent=p?'Продолжить':'Пауза';this.setAttribute('aria-pressed',p)};document.getElementById('bg').onclick=function(){const l=document.body.classList.toggle('light');this.textContent=l?'Тёмный фон':'Светлый фон'}</script></html>
