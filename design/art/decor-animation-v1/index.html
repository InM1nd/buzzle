<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Декорации · анимация</title>
<style>body{margin:0;padding:24px;background:#fff6e3;color:#512d13;font:18px system-ui}main{max-width:1000px;margin:auto}h1{font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:white;border-radius:28px;padding:20px;text-align:center}.scene{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:#eef5d6;border-radius:22px}.scene img{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}.water{animation:water 3s ease-in-out infinite}.shine{position:absolute;inset:0;mask:url(fountain-water.png) center/contain no-repeat;-webkit-mask:url(fountain-water.png) center/contain no-repeat;background:repeating-linear-gradient(0deg,transparent 0%,transparent 20%,#fff9 22%,transparent 24%,transparent 40%);background-size:100% 200%;animation:flow 3s linear infinite}.rotor{transform-origin:51.643% 42.253%;animation:spin 7s linear infinite}.paused *{animation-play-state:paused!important}button{background:#ffb51c;border:0;border-radius:18px;padding:12px 24px;color:#512d13;font:inherit;cursor:pointer}p{line-height:1.5}@keyframes spin{to{transform:rotate(360deg)}}@keyframes water{50%{filter:brightness(1.12)}}@keyframes flow{to{background-position:0 200%}}@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:16px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<main><h1>Фонтан и вертушка</h1><p>Первый этап: движение отдельных слоёв. Камень и стойка остаются неподвижными.</p><button id="pause" aria-pressed="false">Пауза</button><p></p><div class="grid"><article><div class="scene"><img src="fountain.png" alt="Фонтан"><img class="water" src="fountain-water.png" alt=""><div class="shine"></div></div><h2>Фонтан</h2><p>Мягкое мерцание воды и проходящие блики.</p></article><article><div class="scene"><img src="pinwheel-stand.png" alt="Стойка"><img class="rotor" src="pinwheel-rotor.png" alt="Лопасти вертушки"></div><h2>Вертушка</h2><p>Плавное вращение вокруг золотой ступицы.</p></article></div><p>Отдельный прототип. В игру пока не подключён.</p></main><script>document.querySelector('#pause').onclick=function(){let paused=document.body.classList.toggle('paused');this.textContent=paused?'Продолжить':'Пауза';this.setAttribute('aria-pressed',String(paused))}</script></html>
