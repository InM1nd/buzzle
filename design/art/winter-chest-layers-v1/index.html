<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Зимний сундук Buzzle</title><style>body{margin:0;padding:16px;background:#191639;color:#fff6e3;text-align:center;font:18px system-ui}h1{font-size:24px}button{font:inherit;font-weight:700;cursor:pointer;background:#ffc56b;color:#432a19;border:0;border-radius:12px;padding:12px 24px}.stage{position:relative;width:min(100%,380px);aspect-ratio:1024/1306;margin:auto}.stage img{position:absolute;display:block}.base{width:71.484375%;left:14.2578125%;top:52.67993874425727%}.lid{width:76.171875%;left:11.9140625%;top:12.480857580398162%;transform:translateY(85.39325842696628%);transition:transform 620ms cubic-bezier(.2,.7,.25,1)}.open .lid{transform:translateY(0)}@media(prefers-reduced-motion:reduce){.lid{transition:none}}</style><h1>Зимний сундук</h1><div class="stage" id="chest"><img class="base" src="base.webp" alt=""><img class="lid" src="lid.webp" alt=""></div><button id="toggle" aria-controls="chest" aria-expanded="false" type="button">Открыть сундук</button><script>const chest=document.getElementById('chest'),toggle=document.getElementById('toggle');toggle.onclick=()=>{const open=chest.classList.toggle('open');toggle.textContent=open?'Закрыть сундук':'Открыть сундук';toggle.setAttribute('aria-expanded',String(open));};</script></html>
